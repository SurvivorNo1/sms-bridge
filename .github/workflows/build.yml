name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-and-apk:
    name: 单元测试 + 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Unit tests (签名/加密跨语言向量 + HTTP 全链路)
        run: gradle testReleaseUnitTest --no-daemon
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk sms-bridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sms-bridge-apk
          path: sms-bridge.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build ${{ github.run_number }}
          files: sms-bridge.apk

  emulator:
    name: 模拟器端到端（注入真实短信）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb wait-for-device
            adb emu sms send 10690001 "SMS Bridge verification code 482913 valid for 5 minutes"
            sleep 8
            adb shell content query --uri content://sms/inbox --projection address:body || true
            gradle connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/
